<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#13203d">
<meta name="apple-mobile-web-app-title" content="ハイパーカート">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ハイパーカート</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  .ctl{pointer-events:auto;position:absolute}
  #steer{left:0;bottom:0;width:45%;height:70%}
  #steerBase{position:absolute;left:calc(env(safe-area-inset-left) + 28px);bottom:calc(env(safe-area-inset-bottom) + 26px);
    width:210px;height:72px;border-radius:36px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
  #knob{position:absolute;left:69px;top:0;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.5)}
  .btn{pointer-events:auto;position:absolute;border-radius:50%;background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .btn.on{background:rgba(255,214,70,.5)}
  #btnAccel{width:112px;height:112px;right:calc(env(safe-area-inset-right) + 24px);bottom:calc(env(safe-area-inset-bottom) + 22px)}
  #btnDrift{width:86px;height:86px;right:calc(env(safe-area-inset-right) + 36px);bottom:calc(env(safe-area-inset-bottom) + 148px)}
  #btnSkill{flex-direction:column;font-size:12px;line-height:1.1;text-align:center}
  #btnSkill.ready{box-shadow:0 0 0 3px #ffd64a,0 0 18px 6px rgba(255,214,70,.8);animation:blink .5s steps(2) infinite}
  #btnItem{width:78px;height:78px;right:calc(env(safe-area-inset-right) + 146px);bottom:calc(env(safe-area-inset-bottom) + 112px)}
  #itemSlot{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);width:62px;height:62px;
    border-radius:14px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:36px}
  #itemName{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);font-size:12px;font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
  #vignette{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,20,40,.75) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
  #smokeOv{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(150,150,160,.55) 20%,rgba(120,120,130,.95) 100%)}
  #speedlines{position:fixed;inset:-20%;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.55) 5deg 5.5deg);
    -webkit-mask-image:radial-gradient(circle,transparent 32%,#000 72%);mask-image:radial-gradient(circle,transparent 32%,#000 72%)}
  #banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;font-style:italic;
    -webkit-text-stroke:2px rgba(0,0,0,.6);text-shadow:0 4px 12px rgba(0,0,0,.6);opacity:0}
  #banner.show{animation:bannerPop 1.1s ease-out forwards}
  @keyframes bannerPop{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(.92)}20%{transform:scale(1.05)}28%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
  #alert{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);padding:6px 16px;border-radius:16px;
    background:rgba(220,20,40,.85);font-size:17px;font-weight:900;white-space:nowrap;display:none;animation:blink .35s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #itemSlot.roll{animation:shake .12s linear infinite}
  @keyframes shake{0%{transform:translateX(-50%) rotate(-6deg)}50%{transform:translateX(-50%) rotate(6deg)}100%{transform:translateX(-50%) rotate(-6deg)}}
  #itemSlot.pop{animation:slotPop .45s ease-out}
  @keyframes slotPop{0%{transform:translateX(-50%) scale(1.8);box-shadow:0 0 30px 12px rgba(255,230,120,.9)}100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(255,230,120,0)}}
  #menu{position:fixed;inset:0;display:none;z-index:6;pointer-events:none}
  #menu .panel{pointer-events:auto;position:absolute;left:calc(env(safe-area-inset-left) + 18px);top:calc(env(safe-area-inset-top) + 12px);
    bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(46%,430px);display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #menu .panel.wide{left:50%;transform:translateX(-50%);width:min(92%,640px);background:rgba(8,16,34,.82);border-radius:18px;padding:12px 16px;box-sizing:border-box}
  #menu h1{font-size:44px;font-weight:900;font-style:italic;margin:6px 0 0;line-height:1;color:#ffd64a;text-shadow:0 3px 0 #b3401f,0 6px 14px rgba(0,0,0,.5);transform:skewX(-6deg)}
  #menu h2{font-size:22px;font-weight:900;font-style:italic;margin:2px 0 4px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #menu p.note{margin:0;font-size:13px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .mbtn{background:rgba(10,20,42,.78);border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:800;color:#fff}
  .mbtn small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
  .mbtn.primary{background:#ffd64a;color:#141414;border-color:#ffd64a}
  .mbtn.sel{border-color:#ffd64a;box-shadow:inset 0 0 0 2px #ffd64a}
  .mbtn.dim{opacity:.45}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .grid3 .mbtn{padding:6px 8px;font-size:13px;line-height:1.2}
  .rowb{display:flex;gap:8px}
  .rowb .mbtn{flex:1;text-align:center}
  .srow{display:flex;align-items:center;gap:8px;background:rgba(10,20,42,.7);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:700}
  .srow .lab{flex:1}
  .seg{padding:6px 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35);font-size:13px;font-weight:800}
  .seg.on{background:#ffd64a;color:#141414;border-color:#ffd64a}
  .statcard{pointer-events:none;position:absolute;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 14px);
    background:rgba(8,16,34,.78);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;min-width:200px}
  .statcard .nm{font-size:24px;font-weight:900;font-style:italic}
  .stars{color:#ffd64a;letter-spacing:1px}
  table.res{border-collapse:collapse;width:100%;font-size:14px;font-weight:700}
  table.res td{padding:4px 8px;font-variant-numeric:tabular-nums}
  table.res tr.me{background:rgba(255,214,70,.3)}
  table.res td.r{text-align:right}
  #minimap{position:absolute;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 50px);width:124px;height:124px;
    background:rgba(0,0,0,.28);border-radius:12px}
  #laptime{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.9}
  #benchInfo{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translateX(-50%);display:none;z-index:7;
    background:rgba(8,16,34,.85);padding:6px 14px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
  #menu textarea{width:100%;height:120px;font:11px/1.35 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;-webkit-user-select:text;user-select:text}
  .gbar{position:relative;height:18px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
  .gbar i{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#ffd64a;left:50%}
  #editBar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);display:none;z-index:8;gap:8px;align-items:center;
    background:rgba(8,16,34,.88);padding:8px 12px;border-radius:14px;font-size:14px;font-weight:700}
  .editing .btn,.editing #steerBase{outline:3px dashed #ffd64a;outline-offset:3px}
  #btnBrake{width:78px;height:78px;right:calc(env(safe-area-inset-right) + 150px);bottom:calc(env(safe-area-inset-bottom) + 18px)}
  .pill{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 10px);padding:8px 14px;border-radius:18px;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4);font-size:13px;font-weight:600}
  #btnQuit{right:calc(env(safe-area-inset-right) + 118px)}
  #btnReset{right:calc(env(safe-area-inset-right) + 14px)}
  #hud{position:absolute;left:calc(env(safe-area-inset-left) + 16px);top:calc(env(safe-area-inset-top) + 6px);
    font-weight:800;font-style:italic;text-shadow:0 2px 4px rgba(0,0,0,.6);line-height:1.1}
  #rank{font-size:44px}
  #rank small{font-size:16px;margin-left:2px}
  #lapinfo{font-size:18px}
  #tm{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  #spdline{font-size:15px;font-weight:700}
  #warn{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:28px;font-weight:800;color:#ffdf3a;
    text-shadow:0 2px 6px rgba(0,0,0,.8);display:none}
  #count{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:90px;font-weight:900;font-style:italic;
    text-shadow:0 4px 10px rgba(0,0,0,.6)}
  #again{pointer-events:auto;padding:10px 28px;border-radius:22px;background:#ffd64a;color:#000;font-size:16px;font-weight:800}
  #msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:34px;font-weight:800;font-style:italic;
    text-shadow:0 3px 6px rgba(0,0,0,.6);display:none}
  #debug{position:absolute;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 120px);
    font:11px/1.35 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:6px;white-space:pre;display:none}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,30,60,.72);font-size:22px;font-weight:700;text-align:center;gap:10px}
  #rotate{display:none;z-index:10;background:#123}
  @media (orientation:portrait){ #rotate{display:flex} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedlines"></div><div id="vignette"></div><div id="flash"></div><div id="smokeOv"></div>
<div id="ui" style="display:none">
  <div id="hud">
    <div id="rank"><span id="rk">-</span><small>位 / <span id="rkn">8</span></small></div>
    <div id="lapinfo">LAP <span id="lap">1</span>/<span id="lapn">3</span></div>
    <div id="tm">0:00.00</div>
    <div id="laptime"></div>
    <div id="spdline"><span id="spd">0</span> km/h <span id="gearv"></span></div>
  </div>
  <div id="warn">逆走しています</div>
  <div id="count"></div>
  <div id="msg">コースアウト</div>
  <div id="debug"></div>
  <div id="steer" class="ctl"><div id="steerBase"><div id="knob"></div></div></div>
  <div id="btnBrake" class="btn">ブレーキ</div>
  <div id="btnAccel" class="btn">アクセル</div>
  <div id="btnDrift" class="btn">ドリフト</div>
  <div id="btnItem" class="btn">アイテム</div>
  <div id="btnSkill" class="btn"><span id="skillLab">技</span></div>
  <div id="itemSlot"></div><div id="itemName"></div>
  <div id="alert"></div><div id="banner"></div>
  <div id="btnQuit" class="pill">やめる</div>
  <div id="btnReset" class="pill">リスタート</div>
  <canvas id="minimap" width="248" height="248"></canvas>
</div>
<div id="menu"></div>
<div id="benchInfo"></div>
<div id="editBar">ドラッグで移動<div class="seg" id="editReset">初期値</div><div class="seg on" id="editDone">完了</div></div>
<div id="rotate" class="overlay">端末を横にしてください</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// =====================================================================
// CONFIG：調整用パラメータはすべてここに集約
// =====================================================================
const URLP = new URLSearchParams(location.search);
const CFG = {
  debug: URLP.get('debug') === '1',
  render: {
    quality: 'mid',            // ?q=low|mid|high
    maxPixelRatio: 1.5,
    antialias: false,
    mountainClear: 40,         // 遠景の山のふもととコースの間に空ける最小距離(m)
    presets: {
      low:  { pixelRatio: 1.0,  drawDistance: 260, trees: 120, mountains: 18, shadow: false },
      mid:  { pixelRatio: 1.25, drawDistance: 380, trees: 220, mountains: 26, shadow: false },
      high: { pixelRatio: 1.5,  drawDistance: 520, trees: 320, mountains: 34, shadow: true },  // 高：自機のみリアルタイム影
    },
  },
  sky: { top: 0x3f8fe0, horizon: 0xd2ebff, fog: 0xd2ebff, mountainHaze: 0.55 },
  light: { hemi: 1.4, dir: 2.2 },
  track: {
    samplesPerMeter: 0.6,
    shoulder: 4.0, curb: 1.0, embank: 10.0, groundY: -2.5,
    railLow: 0.3, railHigh: 0.9, postEvery: 3, roadBand: 3,
    waterWidth: 45,            // 崖区間の外側に置く水面の幅
    deck: 1.2, pillarEvery: 10, // 橋（立体交差の上側）：床の厚み・橋脚の間隔（サンプル数）
  },
  // 路面種別ごとの最高速倍率・超過時減速：0路面 1縁石 2芝 3法面 4ジャンプ台 5場外 6砂
  surface: { maxMul: [1, 1, 0.65, 0.55, 1, 1, 0.5, 0.9], drag: [0, 0, 8, 9, 0, 0, 12, 6] }, // 7:路地（狭い近道、ほぼ全速）。芝・法面は減速を緩めた // 6:砂（ショートカット。ブースト無しでは近道にならない速さ）
  kart: {
    maxSpeed: 28, accel: 13, brake: 28, reverseMax: 7, coastDrag: 3.5,
    turnRate: 2.1, turnSpeedRef: 7, highSpeedTurnLoss: 0.35,
    grip: 7, slopeGravity: 6,
    wallBounce: 0.15, wallSpeedLoss: 0.18, radius: 0.9, // 壁：跳ね返りと減速（難易度を下げるため緩めた）
    gravity: 22,               // 空中の重力(m/s²)
    stepUp: 0.5,               // これ以下の段差は乗り上げる
    snapDown: 0.3,             // 1ステップでこれ以上路面が下がると空中へ
    airSteer: 0.35, airGrip: 0.5, airTiltLerp: 2,
    rayFwd: 0.9, raySide: 0.6, // 姿勢用レイの前後・左右オフセット
    tiltLerp: 10,
    susK: 260, susD: 18, susImpulse: 0.18, susMin: -0.3, susMax: 0.15, // 着地サスペンション
    bodyRoll: 0.08, wheelRadius: 0.32, steerVisual: 0.45, steerResponse: 14,
    overspeedDrag: 8,          // 最高速超過時（ブースト終了後など）の減速
    steerSlow: 0.1,            // フルステア中は最高速がこの割合だけ下がる（カーブで速度と回転数が落ちる）
  },
  drift: {
    minSpeed: 9,               // これ未満では開始できない（0.6倍未満で解除）
    startSteer: 0.3,           // 開始に必要なステア量
    startBounce: 1.2,          // 開始時の車体の跳ね（見た目）
    turnMin: 0.25, turnMax: 0.66, // 旋回量：外側いっぱい〜内側いっぱい（同速度での通常フルステア比）
    grip: 5,                   // 速度方向が車体方向へ寄る速さ（小さいほど大きく滑る）
    speedLoss: 0.8,
    chargeBase: 1.0, chargeSteer: 0.4, // 溜め速度（1.0＝1秒で1.0。内側いっぱいで1.4倍）
    levels: [1.0, 2.2, 3.4],   // ミニターボ段階1/2/3に必要な溜め
    boostTime: [0.5, 0.9, 1.4],
    colors: [0xd8d8d8, 0x3aa8ff, 0xff9a2a, 0xff4fd8], // 溜め前, 段階1, 2, 3 の火花色
    visAngle: 0.18, visLerp: 8, roll: 0.1,
    trickDur: 0.4, trickBoost: 0.45, trickMinAir: 0.05, // 空中ジャンプアクション
  },
  boost: { maxMul: 1.25, accel: 40, dashTime: 1.0, dashKick: 1.1 },
  sparks: { max: 90, rate: 70, life: 0.35, size: 0.3 },
  rescue: {
    descend: 0.35, lift: 0.45, lower: 0.45, leave: 0.6, liftHeight: 4, dropHeight: 2, killDepth: 15, // 演出の各秒数（復帰までの合計1.25秒）
    backSamples: 18,           // 最後に路面にいた地点から何サンプル戻して降ろすか（約30m：ジャンプの助走分）
    boost: 1.0,                // 復帰直後のブースト秒数（速度を取り戻しやすくする）
    reliefAfter: 2, sameSamples: 30, sameTime: 25, reliefAhead: 45, // 同じ場所(30サンプル以内)で25秒以内に2回落ちたら、45サンプル先へ運ぶ
  },
  collision: { cell: 10 },
  camera: {
    dist: 6.2, height: 2.5, lookAhead: 5, lookHeight: 0.9,
    posLerp: 7, lookLerp: 12, fovBase: 68, fovMax: 84, fovLerp: 4,
    near: 0.1, far: 1600, groundClear: 0.6,
    driftSide: 1.4, sideLerp: 3, boostFov: 8,
  },
  assist: { strength: 0.35, driftMul: 0.4, edgeMargin: 1.5, look: 6, lookSpeed: 0.35, gain: 2.5 }, // ハンドル補助：道の向きに沿うようにステアを足す
  input: { steerRange: 70, steerDeadzone: 0.06, steerExpo: 1.3, autoAccel: false },
  physics: { step: 1 / 120, maxDt: 1 / 20, maxSteps: 8 },
  race: {
    laps: 3, checkpoints: 16,  // チェックポイントはコースを等分して配置（通過順で周回を判定）
    countdown: 3,
    gridBack: 8, gridRow: 6, gridLat: 3, // グリッド：先頭列の位置（ライン手前サンプル数）、列間隔、横位置
    reverseDot: -0.2, reverseTime: 0.6,  // 逆走警告：進行方向との内積とその継続時間
    resultDelay: 1.5,
    shortcutGrace: 3,          // 砂（正規のショートカット）に乗ってからこの秒数はチェックポイントの飛ばしを許可
    rocket: { window: [2.35, 2.8], early: 1.9, boost: 1.2, stall: 0.8, cpuChance: { easy: 0.2, normal: 0.4, hard: 0.7 } },
    // ロケットスタート：カウント開始からwindow秒の間にアクセルを押し、GOまで押し続けると成功。early秒より前から押し続けるとエンスト
  },
  gp: { points: [10, 8, 6, 5, 4, 3, 2, 1] },
  ghost: { interval: 0.05, opacity: 0.38 },
  gyro: { maxAngle: 25, deadzone: 0.04 },
  bench: { warm: 3, duration: 20 }, // 性能テスト：GO後の待ち秒数、1コースの計測秒数
  sound: {
    bgmLevel: 0.5, sfxLevel: 1.0,   // 設定画面の音量(0〜1)に掛ける基準値
    range: 60,                      // 他カートの効果音が聞こえる距離(m)
    finalLapTempo: 1.12,            // 最終ラップのBGMテンポ倍率
    finalLapPause: 2.0,             // ファイナルラップの合図の間、BGMを止める秒数
    // 高回転型4気筒を想定：回転数→爆発周波数(rpm/60×2)。VTEC回転数を超えると高音の成分が加わる
    engine: {
      idleRpm: 1100, redline: 9000, vtecRpm: 5800, boostRpm: 400,

        for (const v of [v00, v01, v10, v01, v11, v10]) { dbPos.push(v[0], v[1], v[2]); dbCol.push(col.r, col.g, col.b); }

    for (let q = 0; q < COLS - 1; q++) {
      const [col, type] = quadInfo(i, q);

    }

    for (let k = 0; k < segs; k++) {

    }

  }

  g.setAttribute('color', new THREE.Float32BufferAttribute(clr, 3));

  DRAWBRIDGE.leaf = null; DRAWBRIDGE.lamps = [];
  if (DB && dbPos.length) { // 跳ね橋の床：切れ目の手前の端を軸に回転させる
    let g0 = 0; while (!gap[g0] || gap[(g0 - 1 + N) % N]) g0 = (g0 + 1) % N;
    const pv = [P[g0 * 3], P[g0 * 3 + 1], P[g0 * 3 + 2]];
    for (let k = 0; k < dbPos.length; k += 3) { dbPos[k] -= pv[0]; dbPos[k + 1] -= pv[1]; dbPos[k + 2] -= pv[2]; }
    const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.Float32BufferAttribute(dbPos, 3)); dg.setAttribute('color', new THREE.Float32BufferAttribute(dbCol, 3)); dg.computeVertexNormals();
    const leaf = new THREE.Group(); leaf.position.set(pv[0], pv[1], pv[2]);
    leaf.add(new THREE.Mesh(dg, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide })));
    const sl = Math.hypot(S[g0 * 3], S[g0 * 3 + 2]); DRAWBRIDGE.axis.set(S[g0 * 3] / sl, 0, S[g0 * 3 + 2] / sl);
    group.add(leaf); DRAWBRIDGE.leaf = leaf;
    for (const sg of [-1, 1]) { const l = sg * (HW[g0] + TR.shoulder + 0.6), lamp = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
      lamp.position.set(P[g0 * 3] + S[g0 * 3] * l, P[g0 * 3 + 1] + 3, P[g0 * 3 + 2] + S[g0 * 3 + 2] * l); group.add(lamp); DRAWBRIDGE.lamps.push(lamp);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3, 6), new THREE.MeshLambertMaterial({ color: 0x444444 })); post.position.set(lamp.position.x, lamp.position.y - 1.5, lamp.position.z); group.add(post); }
  }
  const road = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide }));
  road.receiveShadow = true;

  // ガードレール（見た目1ジオメトリ＋当たり線分）
  const rp = [], ri = [];
  for (const [c, s] of [[1, 0], [11, 1]]) {
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      if (!rail[s][i] || !rail[s][j] || gap[i]) continue;
      const a = vv(i, c), b = vv(j, c), base = rp.length / 3;
      rp.push(a[0], a[1] + TR.railLow, a[2], a[0], a[1] + TR.railHigh, a[2], b[0], b[1] + TR.railLow, b[2], b[0], b[1] + TR.railHigh, b[2]);

  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(rp, 3));
  rg.setIndex(ri); rg.computeVertexNormals();
  group.add(new THREE.Mesh(rg, new THREE.MeshLambertMaterial({ color: C.rail, side: THREE.DoubleSide })));

}

function buildScenery(tr) {

  ground.rotation.x = -Math.PI / 2; ground.position.set(cx, TR.groundY, cz);

  const trunks = new THREE.InstancedMesh(palm ? new THREE.CylinderGeometry(0.16, 0.26, 4.4, 5) : new THREE.CylinderGeometry(0.3, 0.4, 2, 5), new THREE.MeshLambertMaterial({ color: palm ? 0x9a7240 : 0x7a5230, flatShading: true }), Math.max(1, nTree));
  const leaves = new THREE.InstancedMesh(palm ? new THREE.ConeGeometry(2.6, 1.1, 7) : new THREE.ConeGeometry(2.2, 5, 6), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), Math.max(1, nTree));
  // 島（海のコース：ヤシの木はここにだけ置く）
  const isl = SC.islands || [];
  if (isl.length) {
    const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1.25, 1, 12), new THREE.MeshLambertMaterial({ color: C.sand, flatShading: true }), isl.length);
    const mm = new THREE.Matrix4();
    isl.forEach((d, k) => { mm.compose(new THREE.Vector3(d[0], TR.groundY, d[1]), new THREE.Quaternion(), new THREE.Vector3(d[2], 1.2, d[2])); im.setMatrixAt(k, mm); });
    group.add(im);

    if (isl.length) { const d = isl[Math.floor(R() * isl.length)], a = R() * Math.PI * 2, rr = Math.sqrt(R()) * d[2] * 0.85; x = d[0] + Math.cos(a) * rr; z = d[1] + Math.sin(a) * rr; }
    let ok = true;
    for (let i = 0; i < N; i += 2) {
      const dx = P[i * 3] - x, dz = P[i * 3 + 2] - z;
      const lim = HW[i] + TR.shoulder + ((cliff[0][i] || cliff[1][i]) ? TR.waterWidth + 4 : TR.embank + 3);
      if (dx * dx + dz * dz < lim * lim) { ok = false; break; }
    }
    if (!ok) continue;
    const sc = 0.8 + R() * 0.8;
    q.setFromAxisAngle(v.set(0, 1, 0), R() * Math.PI);
    const gy = TR.groundY + (isl.length ? 0.6 : 0);
    m.compose(v.set(x, gy + (palm ? 2.2 : 1) * sc, z), q, s.set(sc, sc, sc)); trunks.setMatrixAt(placed, m);
    m.compose(v.set(x, gy + (palm ? 4.6 : 4.5) * sc, z), q, s.set(sc, sc, sc)); leaves.setMatrixAt(placed, m);
    leaves.setColorAt(placed, c.setHSL((SC.leafHue || 0.27) + R() * 0.06, 0.5, 0.28 + R() * 0.1));
    placed++;

  group.add(trunks, leaves);

  // 岩

    let n = 0;
    for (let t = 0; t < SC.rocks * 20 && n < SC.rocks; t++) {
      const x = minX - 80 + R() * (maxX - minX + 160), z = minZ - 80 + R() * (maxZ - minZ + 160);
      let ok = true;
      for (let i = 0; i < N; i += 3) { const dx = P[i * 3] - x, dz = P[i * 3 + 2] - z, lim = HW[i] + TR.shoulder + TR.embank + 4; if (dx * dx + dz * dz < lim * lim) { ok = false; break; } }
      if (!ok) continue;
      const sc2 = 1.5 + R() * 4;
      m.compose(v.set(x, TR.groundY + sc2 * 0.4, z), q.setFromEuler(new THREE.Euler(R(), R(), R())), s.set(sc2, sc2 * (0.6 + R() * 0.6), sc2)); rk.setMatrixAt(n++, m);
    }

  }

  const mtn = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 6), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, fog: false }), Math.max(1, nM));
  const haze = new THREE.Color(CFG.sky.horizon);
  let trackR = 0; // コース中心から最も遠いサンプルまでの距離（山がコースに重ならないようにする）
  for (let i = 0; i < N; i++) trackR = Math.max(trackR, Math.hypot(P[i * 3] - cx, P[i * 3 + 2] - cz));
  for (let i = 0; i < nM; i++) {
    const a = i / nM * Math.PI * 2 + R() * 0.2, h = MH[0] + R() * (MH[1] - MH[0]), w = 90 + R() * 110;
    const r = Math.max(MD[0] + R() * (MD[1] - MD[0]), trackR + TR.shoulder + TR.embank + w + CFG.render.mountainClear);
    m.compose(v.set(cx + Math.cos(a) * r, TR.groundY + h / 2 - 2, cz + Math.sin(a) * r), q.identity(), s.set(w, h, w));
    mtn.setMatrixAt(i, m);
    mtn.setColorAt(i, c.setHSL((SC.mountainHue || 0.33) - R() * 0.08, 0.35, 0.32).lerp(haze, CFG.sky.mountainHaze));

    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 128;
    const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 128);
    const wc = ['#ffd98a', '#fff4d6', '#8fe3ff', '#ff9ad5'];
    for (let yy = 4; yy < 124; yy += 10) for (let xx = 4; xx < 60; xx += 10) if (R() < 0.45) { g.fillStyle = wc[Math.floor(R() * wc.length)]; g.fillRect(xx, yy, 6, 6); }

    const bg = new THREE.BoxGeometry(1, 1, 1); bg.translate(0, 0.5, 0);
    const mk = (n, fog) => new THREE.InstancedMesh(bg, new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveMap: wt, emissiveIntensity: 0.9, fog }), Math.max(1, n));
    const nb = Math.round(QP.trees * (CT.near || 0.4)), bm = mk(nb, true), H = CT.heights || [15, 70];
    let nbPlaced = 0;
    for (let t = 0; t < nb * 30 && nbPlaced < nb; t++) {
      const x = minX - 150 + R() * (maxX - minX + 300), z = minZ - 150 + R() * (maxZ - minZ + 300), w = 12 + R() * 18, dd = 12 + R() * 18;
      let ok = true;
      for (let i = 0; i < N; i += 2) { const dx = P[i * 3] - x, dz = P[i * 3 + 2] - z, lim = HW[i] + TR.shoulder + TR.embank + Math.max(w, dd) * 0.75 + 4; if (dx * dx + dz * dz < lim * lim) { ok = false; break; } }
      if (!ok) continue;
      m.compose(v.set(x, TR.groundY, z), q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), R() * 0.3), s.set(w, H[0] + R() * (H[1] - H[0]), dd));
      bm.setMatrixAt(nbPlaced, m); bm.setColorAt(nbPlaced, c.setHSL(0.62 + R() * 0.12, 0.25, 0.12 + R() * 0.1)); nbPlaced++;
    }
    bm.count = nbPlaced; group.add(bm);
    let tR = 0; for (let i = 0; i < N; i++) tR = Math.max(tR, Math.hypot(P[i * 3] - cx, P[i * 3 + 2] - cz));
    const nf = CT.far || 40, fm = mk(nf, false);
    for (let i = 0; i < nf; i++) {
      const a = i / nf * Math.PI * 2 + R() * 0.1, r = tR + 220 + R() * 220, w = 30 + R() * 40;
      m.compose(v.set(cx + Math.cos(a) * r, TR.groundY, cz + Math.sin(a) * r), q.identity(), s.set(w, 60 + R() * 160, w));
      fm.setMatrixAt(i, m); fm.setColorAt(i, c.setHSL(0.68, 0.3, 0.08 + R() * 0.06));
    }

      for (let i = 0; i < N; i += every) { if (tr.gap[i]) continue; for (const sg of [-1, 1]) { const i3 = i * 3, l = sg * (HW[i] + TR.shoulder + 0.7); pts.push([P[i3] + S[i3] * l, P[i3 + 1] + S[i3 + 1] * l, P[i3 + 2] + S[i3 + 2] * l]); } }
      const pm = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.16, 7, 5), new THREE.MeshLambertMaterial({ color: 0x3a3f4a }), pts.length);

// ダッシュ板：判定領域（純粋な計算）と見た目（スクロールする矢印）

  const { P, T, S, def } = tr;
  return (def.dashes || []).map(d => {
    const i3 = tr.sampleAt(d.at) * 3;

        pid = e.pointerId; el.setPointerCapture(pid); sx = e.clientX; sy = e.clientY; const p = this.pos(id); px = p.x; py = p.y;

// ジャイロ操作：横持ちでは端末の短辺まわりの傾き（beta）をステアに使う
const Gyro = {
  raw: 0, center: 0, ok: false, listening: false,
  st: { perm: '未要求', motionPerm: '未要求', ori: 0, mot: 0, err: '' }, // 診断用
  async enable() {
    // iOSはタップ直後に許可を求める必要があるため、awaitの前に両方の要求を発行する
    const reqs = [];
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') reqs.push(DeviceOrientationEvent.requestPermission().then(r => (this.st.perm = r)));
      else this.st.perm = typeof DeviceOrientationEvent === 'undefined' ? 'API無し' : '要求不要';
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') reqs.push(DeviceMotionEvent.requestPermission().then(r => (this.st.motionPerm = r)));
      else this.st.motionPerm = typeof DeviceMotionEvent === 'undefined' ? 'API無し' : '要求不要';
      await Promise.all(reqs);
    } catch (e) { this.st.err = String(e && e.message || e); }
    if (!this.listening) {
      addEventListener('deviceorientation', e => this.onEv(e));
      addEventListener('devicemotion', e => this.onMotion(e)); // 傾きイベントが来ない環境向けの代替（重力の向きから計算）
      this.listening = true;
    }
    const ok = !['denied'].includes(this.st.perm) || !['denied'].includes(this.st.motionPerm);
    return ok && !this.st.err;
  },
  landSign() { const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0); return a === 90 ? 1 : (a === -90 || a === 270) ? -1 : 0; },
  onEv(e) {
    if (typeof e.beta !== 'number') return;
    this.st.ori++;
    const s = this.landSign();
    this.raw = s ? s * e.beta : e.gamma; this.ok = true; this.src = 'orientation';
  },
  onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || typeof g.y !== 'number') return;
    this.st.mot++;
    if (this.st.ori > 0) return; // 傾きイベントが使える場合はそちらを優先
    const n = Math.hypot(g.x, g.y, g.z) || 1, s = this.landSign();
    const deg = Math.asin(Math.max(-1, Math.min(1, (s ? g.y : g.x) / n))) * 180 / Math.PI;
    this.raw = s ? -s * deg : -deg; this.ok = true; this.src = 'motion';
  },
  recenter() { this.center = this.raw; },
  steer() {
    if (!Settings.s.gyro || !this.ok) return 0;
    const d = (this.raw - this.center) * (Settings.s.gyroInvert ? -1 : 1), max = CFG.gyro.maxAngle / Settings.s.gyroSens;
    const v = Math.max(-1, Math.min(1, d / max));
    return Math.abs(v) < CFG.gyro.deadzone ? 0 : v;
  },
  diag() {
    return `許可(傾き): ${this.st.perm} / 許可(加速度): ${this.st.motionPerm} / 受信 傾き${this.st.ori}回・加速度${this.st.mot}回 / 使用: ${this.src || 'なし'} / https: ${window.isSecureContext ? 'はい' : 'いいえ'}${this.st.err ? ' / エラー: ' + this.st.err : ''}`;
  },
};

// =====================================================================
// KARTS：モードとキャラ選択に応じて毎レース前に生成
// =====================================================================
let KARTS = [], PLAYER = null;
function setupKarts(mode, charIdx) {
  for (const k of KARTS) { scene.remove(k.model.root, k.drone); k.model.body.geometry.dispose(); }
  const pc = CHARACTERS[charIdx], R = rng(777);
  const list = [createKart({ name: pc.name, char: pc })];
  if (mode === 'gp') {
    const others = CHARACTERS.filter(c => c !== pc), col = new THREE.Color();
    const pri = others.filter(c => c.team === PRIORITY_TEAM), rest = others.filter(c => c.team !== PRIORITY_TEAM);
    for (const a of [pri, rest]) for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    const pool = [...pri, ...rest].slice(0, MAX_KARTS - 1).map(c => ({ char: c, look: c.look, name: c.name }));
    for (let i = 0; pool.length < MAX_KARTS - 1; i++) { // 足りない分は色違い
      const c = others[i % others.length]; col.setHex(c.look.body).offsetHSL(0.45, 0, 0);
      pool.push({ char: c, look: { ...c.look, body: col.getHex() }, name: c.name + '・B' });
    }
    for (const o of pool) {
      const k = createKart({ ...o, cpu: true });
      k.ai.offset = (R() * 2 - 1) * CFG.ai.laneSpread;
      k.ai.wobF = CFG.ai.wobbleFreq[0] + R() * (CFG.ai.wobbleFreq[1] - CFG.ai.wobbleFreq[0]);
      k.ai.ph = R() * Math.PI * 2;
      k.ai.lineMix = CFG.ai.lineMix[0] + R() * (CFG.ai.lineMix[1] - CFG.ai.lineMix[0]);
      list.push(k);
    }
    const cpus = list.filter(k => k.isCPU), sk = cpus.map((_, i) => cpus.length > 1 ? -1 + 2 * i / (cpus.length - 1) : 0);
    for (let i = sk.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [sk[i], sk[j]] = [sk[j], sk[i]]; }
    cpus.forEach((k, i) => { k.ai.skill = sk[i]; });
  }
  KARTS = list; KARTS.forEach((k, i) => { k.slot = i; });
  PLAYER = KARTS[0]; Race.karts = KARTS;
  PLAYER.model.body.castShadow = true;
  for (const k of KARTS) scene.add(k.model.root, k.drone);
  WHEEL.front.count = WHEEL.rear.count = KARTS.length * 2;
  SHADOW.count = KARTS.length;
}

// =====================================================================
// GHOST：タイムアタックの最速走行を記録・再生（localStorage）
// =====================================================================
const Ghost = {
  rec: [], recT: 0, data: null, model: null, _q1: new THREE.Quaternion(), _q2: new THREE.Quaternion(),
  key(ci) { return 'hk.ta.' + COURSES[ci].id; },
  best(ci) { const d = LS.get(this.key(ci), null); return d ? d.time : null; },
  load(ci) {
    if (this.model) { scene.remove(this.model); disposeTree(this.model); this.model = null; }
    this.data = LS.get(this.key(ci), null);
    if (this.data && this.data.frames && this.data.frames.length >= 14) {
      const ch = CHARACTERS.find(c => c.id === this.data.char) || CHARACTERS[0];
      this.model = makeShowKart(ch.look, true); this.model.visible = false; scene.add(this.model);
    }
  },
  clear() { if (this.model) { scene.remove(this.model); disposeTree(this.model); this.model = null; } this.data = null; },
  startRec() { this.rec = []; this.recT = 0; },
  record(k, t) {
    const r = k.model.root, f = v => Math.round(v * 1000) / 1000;
    while (this.recT <= t) { this.rec.push(f(r.position.x), f(r.position.y), f(r.position.z), f(r.quaternion.x), f(r.quaternion.y), f(r.quaternion.z), f(r.quaternion.w)); this.recT += CFG.ghost.interval; }
  },
  play(t) {
    const m = this.model; if (!m) return;
    const F = this.data.frames, n = F.length / 7, fi = t / CFG.ghost.interval, i = Math.floor(fi);
    if (i < 0 || i >= n - 1) { m.visible = i >= n - 1 && n > 0; if (m.visible) { const o = (n - 1) * 7; m.position.set(F[o], F[o + 1], F[o + 2]); } return; }
    const u = fi - i, a = i * 7, b = a + 7;
    m.visible = true;
    m.position.set(F[a] + (F[b] - F[a]) * u, F[a + 1] + (F[b + 1] - F[a + 1]) * u, F[a + 2] + (F[b + 2] - F[a + 2]) * u);
    this._q1.set(F[a + 3], F[a + 4], F[a + 5], F[a + 6]); this._q2.set(F[b + 3], F[b + 4], F[b + 5], F[b + 6]);
    m.quaternion.slerpQuaternions(this._q1, this._q2, u);
  },
  saveIfBest(ci, time, laps, charId) {
    const old = LS.get(this.key(ci), null);
    if (old && old.time <= time) return false;
    const ok = LS.set(this.key(ci), { time, laps, char: charId, frames: this.rec });
    if (!ok) LS.set(this.key(ci), { time, laps, char: charId, frames: [] }); // 容量不足時はタイムのみ保存
    return true;
  },
};

// =====================================================================
// MINIMAP：コース形状は読み込み時に1回描き、毎フレームは点だけ描く
// =====================================================================
const Minimap = {
  cv: $('minimap'), bg: document.createElement('canvas'), map: null, t: 0,
  setup() {
    const { N, P, HW } = TRACK, W = this.cv.width;
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (let i = 0; i < N; i++) { minX = Math.min(minX, P[i * 3]); maxX = Math.max(maxX, P[i * 3]); minZ = Math.min(minZ, P[i * 3 + 2]); maxZ = Math.max(maxZ, P[i * 3 + 2]); }
    const pad = 16, sc = (W - pad * 2) / Math.max(maxX - minX, maxZ - minZ), ox = (W - (maxX - minX) * sc) / 2, oz = (W - (maxZ - minZ) * sc) / 2;
    this.map = (x, z) => [ox + (x - minX) * sc, oz + (z - minZ) * sc];
    this.bg.width = this.bg.height = W;
    const g = this.bg.getContext('2d');
    g.clearRect(0, 0, W, W); g.lineJoin = 'round';
    for (const [w, c] of [[HW[0] * 2 * sc + 6, 'rgba(0,0,0,.55)'], [HW[0] * 2 * sc, 'rgba(255,255,255,.85)']]) {
      g.beginPath(); g.lineWidth = Math.max(3, w); g.strokeStyle = c;
      for (let i = 0; i <= N; i++) { const [x, y] = this.map(P[(i % N) * 3], P[(i % N) * 3 + 2]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.closePath(); g.stroke();
    }
    for (const pd of TRACK.def.pads || []) { g.beginPath(); pd.pts.forEach((q, k) => { const [x, y] = this.map(q[0], q[1]); k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.fillStyle = 'rgba(240,220,160,.85)'; g.fill(); }
    const [sx, sy] = this.map(P[0], P[2]); g.fillStyle = '#ffd64a'; g.fillRect(sx - 5, sy - 5, 10, 10);
  },
  draw(dt) {
    this.t -= dt; if (this.t > 0 || !this.map) return; this.t = 1 / 20;
    const g = this.cv.getContext('2d'), W = this.cv.width;
    g.clearRect(0, 0, W, W); g.drawImage(this.bg, 0, 0);
    if (Ghost.model && Ghost.model.visible) { const [x, y] = this.map(Ghost.model.position.x, Ghost.model.position.z); g.fillStyle = 'rgba(159,220,255,.7)'; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); }
    for (const k of [...KARTS].sort((a, b) => a.isPlayer - b.isPlayer)) {
      const [x, y] = this.map(k.x, k.z), r = k.isPlayer ? 9 : 6.5;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = '#' + new THREE.Color(k.color.body).getHexString(); g.fill();
      g.lineWidth = k.isPlayer ? 4 : 2; g.strokeStyle = k.isPlayer ? '#fff' : 'rgba(0,0,0,.7)'; g.stroke();
    }
  },
};

  Items.setup(App.mode !== 'ta');

  UI.tm.textContent = fmt(p.finished ? p.finishTime : Race.time);
  let lt = '';
  if (p.lap >= 1 && !p.finished && Race.running()) lt = `LAP ${fmt(Race.time - p.lapStart)}`;
  if (p.lapTimes.length) lt += `  前 ${fmt(p.lapTimes[p.lapTimes.length - 1])}`;
  if (ta) { const b = Ghost.data ? Ghost.data.time : null; lt += `${lt ? '<br>' : ''}BEST ${b ? fmt(b) : '--:--.--'}`; }
  if (UI.laptime.innerHTML !== lt) UI.laptime.innerHTML = lt;
  // カウントダウン
  let c = '';
  if (Race.state === 'count') c = String(Math.ceil(R.countdown - Race.t));
  else if (Race.state === 'race' && Race.goT < 0.8) c = 'GO!';
  else if (Race.state === 'post' && Race.postT < R.resultDelay) c = 'ゴール！';
  if (UI.count.textContent !== c) { UI.count.textContent = c; UI.count.style.color = c === 'GO!' ? '#4dff88' : c === '1' ? '#ffd64a' : '#fff'; }
  // 所持アイテム
  const IC = CFG.items;
  let icon = '', name = '';
  if (p.itemState === 'roll') icon = IC.icons[Math.floor(performance.now() / 80) % IC.icons.length];
  else if (p.itemState === 'have') { icon = IC.icons[p.item]; name = IC.names[p.item]; }
  if (UI.lastItem !== icon + name) { UI.itemSlot.textContent = icon; UI.itemName.textContent = name; UI.lastItem = icon + name; }
  if (UI.lastState !== p.itemState) {
    UI.itemSlot.classList.toggle('roll', p.itemState === 'roll');
    if (UI.lastState === 'roll' && p.itemState === 'have') { UI.itemSlot.classList.remove('pop'); void UI.itemSlot.offsetWidth; UI.itemSlot.classList.add('pop'); }
    UI.lastState = p.itemState;
  }
  let al = '';
  if (Items.strikes.some(s => s.tgt === p && !s.fired)) al = '⚠ サテライトロックオン！';
  else if (Gimmicks.alertText) al = Gimmicks.alertText;
  else if (Items.homings.some(h => h.tgt === p)) al = '⚠ 追跡ドローン接近！';
  if (UI.lastAlert !== al) { UI.alert.textContent = al; UI.alert.style.display = al ? 'block' : 'none'; UI.lastAlert = al; }
  const i3 = p.idx * 3;
  const dot = Math.sin(p.yaw) * TRACK.T[i3] + Math.cos(p.yaw) * TRACK.T[i3 + 2];
  if (Race.state === 'race' && p.state === 'drive' && dot < R.reverseDot && Math.abs(p.speed) > 3) p.revT += dt; else p.revT = 0;
  UI.warn.style.display = p.revT > R.reverseTime ? 'block' : 'none';
}

// =====================================================================
// BENCH：実機確認用の性能テスト（3コースを自動走行して計測、結果をコピー可能）
// =====================================================================
const Bench = {
  active: false, ci: 0, t: 0, S: null, results: [], text: '', lastInfo: -1,
  start() { this.active = true; this.results = []; this.ci = 0; this.begin(); },
  begin() {
    App.mode = 'gp';
    setupKarts('gp', Settings.charIdx());
    App.gp = { courses: COURSES.map((_, i) => i), idx: 0, pts: KARTS.map(() => 0), last: null };
    App.startRace(this.ci);
    PLAYER.isCPU = true; // プレイヤー車も自動走行
    this.t = 0; this.lastInfo = -1;
    this.S = { ft: [], calls: 0, tris: 0, n: 0, ai: 0, phys: 0, vis: 0, rend: 0, ui: 0 };
    $('benchInfo').style.display = 'block';
  },
  frame(ftMs, parts) {
    if (!this.active || (Race.state !== 'race' && Race.state !== 'post')) return;
    const B = CFG.bench, S = this.S;
    this.t += ftMs / 1000;
    const left = Math.ceil(B.warm + B.duration - this.t);
    if (left !== this.lastInfo) { $('benchInfo').textContent = `性能テスト中 ${this.ci + 1}/${COURSES.length} ${COURSES[this.ci].name} 残り${Math.max(0, left)}秒`; this.lastInfo = left; }
    if (this.t < B.warm) return;
    S.ft.push(ftMs); S.calls += renderer.info.render.calls; S.tris += renderer.info.render.triangles; S.n++;
    for (const k in parts) S[k] += parts[k];
    if (this.t >= B.warm + B.duration) this.finishCourse();
  },
  finishCourse() {
    const S = this.S, ft = [...S.ft].sort((a, b) => a - b), n = ft.length || 1, mean = ft.reduce((a, b) => a + b, 0) / n;
    this.results.push({
      name: COURSES[this.ci].name, fps: 1000 / mean, low: 1000 / ft[Math.min(n - 1, Math.floor(n * 0.99))],
      slow: ft.filter(v => v > 1000 / 30 + 0.5).length / n * 100, calls: S.calls / n, tris: S.tris / n,
      ai: S.ai / n, phys: S.phys / n, vis: S.vis / n, rend: S.rend / n, ui: S.ui / n, frames: n,
    });
    this.ci++;
    if (this.ci < COURSES.length) this.begin(); else this.end();
  },
  end() {
    this.active = false; $('benchInfo').style.display = 'none';
    const P = CFG.render.presets[CFG.render.quality], f1 = v => v.toFixed(1), f2 = v => v.toFixed(2);
    this.text = [
      'ハイパーカート 性能テスト',
      `端末: ${navigator.userAgent}`,
      `画面: ${window.innerWidth}x${window.innerHeight} DPR ${window.devicePixelRatio} / 描画倍率 ${renderer.getPixelRatio().toFixed(2)} / 起動: ${navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches ? 'ホーム画面アプリ' : 'ブラウザ'}`,
      `画質: ${CFG.render.quality}（影 ${P.shadow ? 'あり' : 'なし'}・木${P.trees}）/ CPU: ${CFG.ai.difficulty} / 音声: ${Sound.state}・エンジン音 ${Sound.engineMode}`,
      'コース / 平均fps / 1%低fps / 30fps未満の割合 / draw calls / 三角形 / CPU時間ms（AI・物理・描画準備・render呼び出し・UI音）',
      ...this.results.map(r => `${r.name} / ${f1(r.fps)} / ${f1(r.low)} / ${f1(r.slow)}% / ${Math.round(r.calls)} / ${Math.round(r.tris)} / ${f2(r.ai)}・${f2(r.phys)}・${f2(r.vis)}・${f2(r.rend)}・${f2(r.ui)}`),
    ].join('\n');
    App.toMenu('bench');
  },
  cancel() { if (!this.active) return; this.active = false; $('benchInfo').style.display = 'none'; },
};

// =====================================================================
// APP：画面遷移・モード進行
// =====================================================================
const App = {
  view: 'menu', mode: 'gp', gp: null, resultShown: false, accelWas: false, pressT: -1,
  act(a, v) {
    const s = Settings.s;
    switch (a) {
      case 'start': Sound.unlock(); if (s.gyro) Gyro.enable(); Menu.show('mode'); break;
      case 'mode': this.mode = v; Menu.show('char'); break;
      case 'char': s.charId = CHARACTERS[+v].id; Settings.save(); Menu.refresh(); break;
      case 'charOk': Menu.show(this.mode === 'ta' ? 'course' : 'gpInfo'); break;
      case 'back': Menu.show(v); break;
      case 'settings': Menu.show('settings'); break;
      case 'set': { const i = v.indexOf(':'); s[v.slice(0, i)] = JSON.parse(v.slice(i + 1)); Settings.save(); Menu.refresh(); break; }
      case 'step': {
        const i = v.indexOf(':'), key = v.slice(0, i), d = +v.slice(i + 1);
        const lim = key === 'gyroSens' ? [0.5, 2.0] : key === 'btnScale' ? [0.7, 1.4] : [0, 1];
        s[key] = Math.round(Math.max(lim[0], Math.min(lim[1], s[key] + d)) * 10) / 10; Settings.save(); Menu.refresh(); if (key === 'sfxVol') Sound.play('itemGet'); break;
      }
      case 'gyro': {
        const on = v.endsWith('true');
        if (!on) { s.gyro = false; Settings.save(); Menu.refresh(); break; }
        Gyro.enable().then(ok => { s.gyro = ok; Settings.save(); Menu.refresh(); if (!ok) Screen.banner('ジャイロの許可が得られませんでした', '#ff9b9b'); });
        break;
      }
      case 'layout': Layout.begin(); break;
      case 'benchStart': Sound.unlock(); Bench.start(); break;
      case 'benchCopy': {
        const ta = $('benchText');
        const fallback = () => { // 自動コピーできない場合は全選択して長押しコピーを案内
          ta.focus(); ta.select();
          let ok = false; try { ok = typeof document.execCommand === 'function' && document.execCommand('copy'); } catch (e) { ok = false; }
          Screen.banner(ok ? 'コピーしました' : '全選択しました。長押ししてコピーしてください', '#ffffff');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(Bench.text).then(() => Screen.banner('コピーしました', '#ffffff'), fallback);
        else fallback();
        break;
      }
      case 'gyroTest': Menu.show('gyroTest'); break;
      case 'gyroCenter': Gyro.recenter(); break;
      case 'gyroInv': s.gyroInvert = !s.gyroInvert; Settings.save(); Menu.refresh(); break;
      case 'soundTest': Sound.unlock(); Menu.show('soundTest'); break;
      case 'sndTest': Sound.play(v); break;
      case 'clearTA': COURSES.forEach((_, i) => LS.del(Ghost.key(i))); Screen.banner('記録を消去しました', '#ffffff'); Menu.refresh(); break;
      case 'course': this.startTA(+v); break;
      case 'courseSel': this.toMenu('course'); break;
      case 'retryTA': this.startTA(COURSE_IDX); break;
      case 'gpStart': this.startGP(+v || 0); break;
      case 'gpStand': Menu.show('gpStand', this.standings()); break;
      case 'nextRace': this.startRace(this.gp.courses[this.gp.idx]); break;
      case 'podium': this.showPodium(); break;
      case 'title': this.toTitle(); break;
    }
  },
  startGP(cup = 0) {
    this.mode = 'gp';
    setupKarts('gp', Settings.charIdx());
    this.gp = { cup, courses: cupCourses(cup), idx: 0, pts: KARTS.map(() => 0), last: null };
    this.startRace(this.gp.courses[0]);
  },
  startTA(ci) {
    this.mode = 'ta';
    setupKarts('ta', Settings.charIdx());
    this.startRace(ci);
  },
  startRace(ci) {
    loadCourse(ci);
    Items.setup(this.mode !== 'ta');
    let grid;
    if (this.mode === 'gp') grid = this.gp.last ? [...this.gp.last].reverse() : [...KARTS.filter(k => k.isCPU), PLAYER]; // 初戦は最後尾、以降は前戦の逆順
    Race.reset(grid);
    if (this.mode === 'ta') { Ghost.load(ci); Ghost.startRec(); } else Ghost.clear();
    Gyro.recenter();
    this.view = 'race'; this.resultShown = false; this.pressT = -1; this.accelWas = false;
    Menu.hide(); $('ui').style.display = 'block';
    Sound.bgm(TRACK.def.bgm || 'green'); Sound.tempo(1); this.snd = {};
    Skills.enabled = this.mode !== 'ta'; $('btnSkill').style.display = Skills.enabled ? '' : 'none';
    UI.rank.style.display = this.mode === 'ta' ? 'none' : ''; UI.rkn.textContent = KARTS.length; UI.lapn.textContent = CFG.race.laps;
  },
  restartRace() { if (this.view === 'race' && !this.resultShown) this.startRace(COURSE_IDX); },
  toMenu(name) { if (name !== 'bench') Bench.cancel(); this.view = 'menu'; Race.state = 'title'; $('ui').style.display = 'none'; Ghost.clear(); Menu.show(name); },
  toTitle() { this.toMenu('title'); },
  trackRocket() { // カウント中のアクセル押し始めの時刻を記録
    const m = Input.manualAccel;
    if (m && !this.accelWas) this.pressT = Race.t;
    if (!m) this.pressT = -1;
    this.accelWas = m;
  },
  onGo() {
    const RR = CFG.race.rocket;
    for (const k of KARTS) {
      if (k.isPlayer) {
        if (!Input.manualAccel || this.pressT < 0) continue;
        if (this.pressT >= RR.window[0] && this.pressT <= RR.window[1]) this.rocket(k);
        else if (this.pressT < RR.early) { k.stallT = RR.stall; Sound.play('stall'); FX.burst(k.x, k.y + 0.8, k.z, 0x888888, 16, 3, 0.8, true, -1); Screen.banner('エンスト…', '#bbbbbb'); }
      } else if (Math.random() < RR.cpuChance[CFG.ai.difficulty]) this.rocket(k);
    }
  },
  rocket(k) {
    giveBoost(k, CFG.race.rocket.boost, 'rocket');
    FX.burst(k.x - Math.sin(k.yaw) * 1.5, k.y + 0.6, k.z - Math.cos(k.yaw) * 1.5, [0xffd64a, 0xff8a2a, 0xffffff], 20, 7, 0.5, true, 2);
    if (k.isPlayer) Screen.banner('ロケットスタート！', '#ffd64a');
  },
  // 状態の変化を見て効果音・BGMを鳴らす（プレイヤー中心）
  soundFrame(now, dt = 1 / 60) {
    const p = PLAYER, S = this.snd || (this.snd = {}), R = CFG.race, SC = CFG.sound;
    if (Race.state === 'count') { const n = Math.ceil(R.countdown - Race.t); if (n !== S.count && n > 0 && n <= 3) Sound.play('count'); S.count = n; }
    if (Race.state === 'race' && S.state === 'count') Sound.play('go');
    S.state = Race.state;
    Sound.engine(p, p.state === 'drive' || p.state === 'rescue', Race.state === 'count' && Input.manualAccel, dt);
    if (p.drifting && !S.drift) Sound.play('driftStart');
    S.drift = p.drifting;
    if (p.boostT > (S.boost || 0) + 0.05) {
      const w = p.lastBoost;
      if (w !== 'skill') Sound.play(w.startsWith('miniturbo') ? 'turbo' + w.slice(-1) : ['dash', 'jet', 'trick', 'rocket'].includes(w) ? w : 'dash');
    }
    S.boost = p.boostT;
    if (p.grounded && S.grounded === false && p.lastLand > SC.landMin) Sound.play('land', Math.min(1, p.lastLand / 15));
    S.grounded = p.grounded;
    if (p.wallImp > SC.wallMin) Sound.play('wall', Math.min(1, p.wallImp / 15));
    for (const k of KARTS) k.wallImp = 0;
    if (S.lap !== undefined && p.lap !== S.lap) {
      if (p.lap > R.laps) { Sound.play('goal'); Sound.stopBgm(); }
      else if (p.lap === R.laps && R.laps > 1) { Sound.pauseBgm(SC.finalLapPause); Sound.play('finalLap'); Sound.tempo(SC.finalLapTempo); Screen.banner('ファイナルラップ！', '#ffffff'); }
      else if (p.lap > 1) Sound.play('lap');
    }
    S.lap = p.lap;
    if (p.itemState === 'roll') { const i = Math.floor(now / 80); if (i !== S.tick) Sound.play('tick'); S.tick = i; }
    if (S.item === 'roll' && p.itemState === 'have') Sound.play('itemGet');
    S.item = p.itemState;
    // 狙われている警告音
    S.warnT = (S.warnT || 0) - 1 / 60;
    if (S.warnT <= 0) {
      if (Items.strikes.some(s => s.tgt === p && !s.fired)) { Sound.play('strikeWarn'); S.warnT = 0.3; }
      else if (Items.homings.some(h => h.tgt === p)) { Sound.play('homingWarn'); S.warnT = 0.45; }
    }
  },
  checkResult() {
    if (Bench.active || this.resultShown || Race.state !== 'post' || Race.postT < CFG.race.resultDelay) return;
    this.resultShown = true;
    if (this.mode === 'gp') {
      const order = Race.rank();
      order.forEach(k => { this.gp.pts[k.slot] += CFG.gp.points[k.rank - 1] || 0; });
      this.gp.last = order; this.gp.idx++;
      Menu.show('result', { order, no: this.gp.idx, course: COURSES[COURSE_IDX].name });
    } else {
      const old = Ghost.data ? Ghost.data.time : null;
      const isNew = Ghost.saveIfBest(COURSE_IDX, PLAYER.finishTime, PLAYER.lapTimes, PLAYER.char.id);
      Menu.show('taResult', { course: COURSES[COURSE_IDX].name, time: PLAYER.finishTime, laps: PLAYER.lapTimes, best: isNew ? PLAYER.finishTime : old, isNew });
      if (isNew) { Screen.banner('新記録！', '#ffd64a'); Sound.play('newRecord'); }
    }
  },
  standings() {
    const rows = KARTS.map(k => ({ k, pts: this.gp.pts[k.slot], last: this.gp.last ? this.gp.last.indexOf(k) : 0 }))
      .sort((a, b) => b.pts - a.pts || a.last - b.last);
    return { rows, done: this.gp.idx, total: this.gp.courses.length };
  },
  showPodium() {
    const st = this.standings();
    this.view = 'menu'; Race.state = 'title'; $('ui').style.display = 'none';
    Show.setPodium(st.rows.slice(0, 3).map(r => r.k));
    Menu.show('podium', st);
  },
};

// =====================================================================
// DEBUG：?debug=1
// =====================================================================
const Debug = { el: $('debug'), frames: 0, t: 0, fps: 0, dtMs: 0 };
if (CFG.debug) Debug.el.style.display = 'block';
function buildDebugCourse() {
  const { N, P, S } = TRACK, g = new THREE.Group();
  const mk = (off, color) => {
    const lp = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { const l = off(i); lp[i * 3] = P[i * 3] + S[i * 3] * l; lp[i * 3 + 1] = P[i * 3 + 1] + S[i * 3 + 1] * l + 0.15; lp[i * 3 + 2] = P[i * 3 + 2] + S[i * 3 + 2] * l; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(lp, 3));
    g.add(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color, fog: false })));
  };
  mk(() => 0, 0x00ffff);
  mk(i => LINE[i], 0x33ff66);
  const cpGeo = new THREE.SphereGeometry(0.8, 8, 6), cpMat = new THREE.MeshBasicMaterial({ color: 0xff2266 });
  for (const p of TRACK.def.points) { const s = new THREE.Mesh(cpGeo, cpMat); s.position.set(p[0], p[2] + 1, p[1]); g.add(s); }
  const cm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 4, 0.3), new THREE.MeshBasicMaterial({ color: 0xffee00 }), Race.CPN * 2);
  const m = new THREE.Matrix4(); let n = 0;
  for (let c = 0; c < Race.CPN; c++) { const i = Race.cpSample(c), i3 = i * 3, hw = TRACK.HW[i];
    for (const sg of [-1, 1]) { m.makeTranslation(P[i3] + S[i3] * hw * sg, P[i3 + 1] + S[i3 + 1] * hw * sg + 2, P[i3 + 2] + S[i3 + 2] * hw * sg); cm.setMatrixAt(n++, m); } }
  g.add(cm);
  courseGroup.add(g);
}
function updateDebug(dt, order) {
  Debug.frames++; Debug.t += dt;
  if (Debug.t < 0.5) return;
  Debug.fps = Debug.frames / Debug.t; Debug.dtMs = Debug.t / Debug.frames * 1000; Debug.frames = 0; Debug.t = 0;
  const inf = renderer.info.render, k = PLAYER;
  Debug.el.textContent =
    `fps ${Debug.fps.toFixed(1)}  (${Debug.dtMs.toFixed(1)}ms)  view ${App.view} mode ${App.mode}\n` +
    `draw calls ${inf.calls}  tris ${inf.triangles}\n` +
    `quality ${CFG.render.quality}  pr ${renderer.getPixelRatio().toFixed(2)}  cpu ${CFG.ai.difficulty}  gyro ${Gyro.ok ? (Gyro.raw - Gyro.center).toFixed(1) : '-'}  audio ${Sound.state} bgm ${Sound.bgmName || '-'} rpm ${Sound.rpm} G${Sound.gear} engine ${Sound.engineMode}\n` +
    (App.view !== 'race' ? '' :
    `pos ${k.x.toFixed(1)}, ${k.y.toFixed(1)}, ${k.z.toFixed(1)}  ${k.grounded ? 'ground' : 'AIR'} ${SURF_NAME[k.surf]}\n` +
    `speed ${(k.speed * 3.6).toFixed(1)} km/h  drift ${k.drifting ? (k.driftDir > 0 ? 'R' : 'L') : '-'} lv${driftLevel(k.charge)} boost ${k.boostT.toFixed(2)} ${k.lastBoost}\n` +
    `sample ${k.idx}/${TRACK.N}  cp ${k.cp}/${Race.CPN}  lap ${k.lap}  rocket press ${App.pressT.toFixed(2)}\n` +
    `items: shot ${Items.shots.length} homing ${Items.homings.length} trap ${Items.traps.length} strike ${Items.strikes.length}  ghost ${Ghost.data ? (Ghost.data.frames.length / 7) + 'f' : '-'} rec ${Ghost.rec.length / 7}f\n` +
    order.map(o => `${o.rank}. ${o.name.padEnd(4)} L${o.lap} cp${String(o.cp).padStart(2)} ${o.progress < 1e5 ? o.progress.toFixed(2) : 'fin'} x${o.speedMul.toFixed(3)}${o.isCPU ? ' skill' + o.ai.skill.toFixed(2) : ''} ${o.itemState === 'have' ? CFG.items.icons[o.item] : ''}${o.spinT > 0 ? ' SPIN' : ''} 技${Math.round(o.sp * 100)}%`).join('\n'));
}

// =====================================================================
// MAIN
// =====================================================================
Settings.load(); Layout.init();
window.addEventListener('resize', () => Layout.apply());
setupKarts('gp', Settings.charIdx());
loadCourse(0);
Race.reset(); Race.state = 'title';
Menu.show('title');
let last = performance.now(), acc = 0, order = Race.rank();
renderer.setAnimationLoop(now => {
  const rawMs = now - last, pt0 = performance.now();
  let pAI = 0, pPhys = 0, pt1 = pt0;
  const dt = Math.min((now - last) / 1000, CFG.physics.maxDt);
  last = now;
  readInput(dt);
  const paused = UI.portrait.matches;
  if (App.view === 'race') {
    if (!paused) Race.update(dt);
    if (Race.state === 'count') App.trackRocket();
    if (Race.running() && !paused) {
      for (const k of KARTS) {
        if (k.isCPU || k.finished) cpuThink(k, dt);
        else { const p = k.inp; p.steer = Math.max(-1, Math.min(1, Input.steer + steerAssist(k, Input.steer))); p.accel = Input.accel; p.brake = Input.brake; p.drift = Input.drift; p.driftEdge = p.driftEdge || Input.driftEdge; }
      }
      pAI = performance.now() - pt0;
      Input.driftEdge = false;
      acc += dt;
      let n = 0;
      while (acc >= CFG.physics.step && n < CFG.physics.maxSteps) {
        for (const k of KARTS) stepKart(k, k.inp, CFG.physics.step);
        collideKarts(KARTS);
        Items.step(CFG.physics.step);
        Gimmicks.step(CFG.physics.step);
        acc -= CFG.physics.step; n++;
      }
      if (n === CFG.physics.maxSteps) acc = 0;
      for (const k of KARTS) Rescue.update(k, dt);
      if (Input.itemEdge && !PLAYER.finished) Items.use(PLAYER);
      if (Input.skillEdge && !PLAYER.finished) Skills.use(PLAYER);
      for (const k of KARTS) Skills.fill(k, dt);
      order = Race.rank();
      applyRubberBand(KARTS);
    } else Input.driftEdge = false;
    pt1 = performance.now(); pPhys = pt1 - pt0 - pAI;
    Input.itemEdge = false; Input.skillEdge = false;
    Skills.frame(Race.running() && !paused ? dt : 0, now / 1000);
    Gimmicks.frame(paused ? 0 : dt, Race.running());
    KARTS.forEach(updateKartVisual);
    WHEEL.front.instanceMatrix.needsUpdate = WHEEL.rear.instanceMatrix.needsUpdate = SHADOW.instanceMatrix.needsUpdate = true;
    Sparks.update(paused ? 0 : dt, KARTS);
    DASH.tex.offset.y -= dt * 2.5;
    Items.frame(Race.running() && !paused ? dt : 0, now / 1000);
    FX.update(paused ? 0 : dt);
    if (App.mode === 'ta') {
      if (Race.state === 'race' && !PLAYER.finished) Ghost.record(PLAYER, Race.time);
      Ghost.play(Race.running() ? Race.time : 0);
    }
    const pt2 = performance.now();
    updateCamera(PLAYER, dt);
    if (QP.shadow) { sun.target.position.set(PLAYER.x, PLAYER.y, PLAYER.z); sun.position.set(PLAYER.x + 15, PLAYER.y + 30, PLAYER.z + 9); }
    renderer.render(scene, camera);
    const pt3 = performance.now();
    updateHUD(dt);
    Minimap.draw(dt);
    App.soundFrame(now, dt);
    App.checkResult();
    Bench.frame(rawMs, { ai: pAI, phys: pPhys, vis: pt2 - pt1, rend: pt3 - pt2, ui: performance.now() - pt3 });
  } else if (App.view === 'edit') {
    if (PLAYER) Sound.engine(PLAYER, false);
    renderer.render(scene, camera);
  } else {
    if (PLAYER) Sound.engine(PLAYER, false);
    if (Menu.cur === 'gyroTest') { // ジャイロのテスト画面を毎フレーム更新
      const v = Gyro.steer(), el = $('gyroVal'), bar = $('gyroBar');
      if (el) el.textContent = Gyro.ok ? `${(Gyro.raw - Gyro.center).toFixed(1)}°  → ステア ${v >= 0 ? '右' : '左'} ${Math.round(Math.abs(v) * 100)}%` : 'センサーの値なし';
      if (bar) bar.style.left = (50 + v * 48) + '%';
      const dg = $('gyroDiag'); if (dg) dg.textContent = Gyro.diag();
    }
    Show.update(dt);
    renderer.render(Show.scene, Show.cam);
  }
  Screen.update(dt);
  if (CFG.debug) updateDebug(dt, order);
});
</script>
<script>
// アプリ化：https上ならService Workerを登録（オフライン起動用）
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
